<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="qriousguy.com">
  <!-- The Q is a network: agents spaced around a ring of links, a bright hub at
       the top, and the tail running out to one more agent. Colours are the
       Nebula tokens (bg, swarm-edge, swarm-signal, swarm-glow) from tokens.css.
       Note: XML comments cannot contain a double hyphen, so no var() names here. -->
  <defs>
    <radialGradient id="field" cx="62%" cy="32%" r="68%">
      <stop offset="0" stop-color="#26316B"/>
      <stop offset="1" stop-color="#26316B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C7D2FF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#C7D2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="#070A14"/>
  <rect width="64" height="64" rx="12" fill="url(#field)"/>

  <g stroke="#7C8CFF" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="31" cy="30" r="17"/>
    <!-- the tail starts inside the bowl and crosses the ring: that crossing is
         what reads as a Q rather than a magnifier -->
    <path d="M35 34 49.5 48.5"/>
  </g>

  <circle cx="31" cy="13" r="11" fill="url(#hub)" opacity=".55"/>
  <g fill="#C7D2FF">
    <circle cx="48" cy="30" r="3.6"/>
    <circle cx="14" cy="30" r="3.6"/>
    <circle cx="31" cy="47" r="3.6"/>
    <circle cx="43" cy="42" r="4"/>
    <circle cx="31" cy="13" r="5.4" fill="#E8EAF2"/>
  </g>
</svg>
